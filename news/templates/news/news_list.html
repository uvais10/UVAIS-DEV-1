{% extends "base.html" %}

{% block title %}News{% endblock %}

{% block content %}
<h2>Latest Kerala Travel News</h2>
<ul class="article-list">
    {% for article in articles %}
        <li><a href="{% url 'news:news_detail' article.slug %}">{{ article.title }}</a></li>
    {% empty %}
        <li>No articles yet.</li>
    {% endfor %}
</ul>
{% endblock %}
